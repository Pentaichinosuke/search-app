<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配列検索</title>

    <link rel="stylesheet" href="style.css">

    <!-- Excel読み込み用 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <button
            id="menuBtn"
            class="menu-btn"
            type="button"
            aria-label="弾のメニューを開く"
            aria-controls="sideMenu"
            aria-expanded="false"
        >☰</button>

        <h1>配列検索</h1>

        <div id="currentRound" class="current-round">VR4</div>
    </header>

    <!-- ハンバーガーメニュー -->
    <nav
        id="sideMenu"
        class="side-menu"
        aria-label="弾の選択"
    >
        <div class="menu-title">弾を選択</div>

        <!-- script.js の ROUNDS から自動生成 -->
        <div id="roundMenu"></div>
    </nav>

    <!-- メニューを開いたときの背景 -->
    <div id="menuOverlay" class="menu-overlay"></div>

    <!-- 検索 -->
    <main>
        <div class="controls">
            <input
                type="number"
                id="searchInput"
                placeholder="検索したい数字"
                inputmode="numeric"
            >

            <button id="searchBtn" type="button">検索</button>
            <button id="resetBtn" type="button">リセット</button>
        </div>

        <!-- Excelの表を表示 -->
        <div id="sheetsContainer"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
